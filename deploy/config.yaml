# bang — address-bar shortcuts. Saved changes reload instantly; a config that
# fails to parse is rejected and the running one stays live.
#
# Rules are tried in order, first match wins. Patterns are anchored implicitly,
# so `pr` matches only the exact string "pr". Capture groups are $1..$9 and are
# percent-encoded on substitution. {{name}} refers to vars below, and vars may
# refer to other vars when their values are quoted.

listen: 127.0.0.1:8111

fallback: https://www.google.com/search?q={{q}}

vars:
  gh: https://github.com
  go_repo: "{{gh}}/golang/go"

rules:
  - match: "pr"
    to: "{{go_repo}}/pulls"
    desc: Open Go pull requests

  # GitHub redirects /issues/N to /pull/N when N is a pull request.
  - match: '#(\d+)'
    to: "{{go_repo}}/issues/$1"
    desc: Go issue or pull request by number

  - match: "is"
    to: "{{go_repo}}/issues"
    desc: Go issues

  - match: "m"
    to: https://music.youtube.com/
    desc: YouTube Music

  - match: "hn"
    to: https://news.ycombinator.com/
    desc: Hacker News

  - match: "m (.+)"
    to: https://music.youtube.com/search?q=$1
    desc: Search YouTube Music

  - match: "y (.+)"
    to: https://www.youtube.com/results?search_query=$1
    desc: Search YouTube
