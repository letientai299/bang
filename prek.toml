# `mise run <task>`, never `mise <task>`: mise has built-in `fmt` and `run`
# subcommands that would shadow the tasks of the same name.
[[repos]]
repo = "local"
hooks = [
  { id = "fmt", name = "fmt", entry = "mise run fmt", language = "system", pass_filenames = false, stages = [
    "pre-commit",
  ] },
  { id = "lint", name = "lint", entry = "mise run lint", language = "system", pass_filenames = false, stages = [
    "pre-commit",
  ] },
  { id = "test", name = "test", entry = "mise run test", language = "system", pass_filenames = false, files = "\\.go$", stages = [
    "pre-commit",
  ] },
]
