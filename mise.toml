[tools]
go = "latest"
golangci-lint = "2"
ko = "latest"
prek = "latest"
prettier = "latest"
shellcheck = "latest"
shfmt = "latest"
watchexec = "2"

[env]
_.path = ["bin"]

[hooks.enter]
script = '''
{% if os_family() == "unix" %}
if command -v prek >/dev/null 2>&1; then
  if [ -f "$MISE_PROJECT_ROOT/prek.toml" ] && [ -d "$MISE_PROJECT_ROOT/.git" ]; then
    if [ ! -x "$MISE_PROJECT_ROOT/.git/hooks/pre-commit" ]; then
      prek install --install-hooks --config "$MISE_PROJECT_ROOT/prek.toml" --quiet
    fi
  fi
fi
{% endif %}
'''

# -- build / run --

[tasks.build]
description = "Build the bang binary into bin/"
alias = "b"
run = "go build -trimpath -o bin/bang ."
sources = ["*.go", "go.mod", "go.sum"]
outputs = ["bin/bang"]

# Named "serve", not "run": `mise run` is a built-in subcommand and would
# shadow the task. Same reason `fmt` below must be invoked as `mise run fmt`.
[tasks.serve]
description = "Run the resolver against the repo's example config"
run = "go run . -config deploy/config.toml -v"

# Only .go files. The config is reloaded in-process, so restarting on a write
# to it would paper over the reload path — the part worth exercising by hand.
#
# Builds and execs rather than `go run`: go run holds the server as a child
# process, and watchexec's stop signal reaches the parent first, so a restart
# could leave the old server owning port 8111 and the new one failing to bind.
# exec puts the server itself at the head of the process group.
#
# A separate binary from `build`, which is cached on sources/outputs: sharing
# bin/bang would let a dev build satisfy that cache, and `install` would then
# ship a binary that never went through -trimpath.
[tasks.dev]
description = "Run the resolver, restarting it on Go changes"
alias = "d"
run = "watchexec --restart --exts go -- 'go build -o bin/bang-dev . && exec bin/bang-dev -config deploy/config.toml -v'"

# --bare keeps the tag at $KO_DOCKER_REPO instead of appending the Go import
# path, so the image is plain `ko.local/bang`. Needs a running Docker daemon.
# ko loads the image through the Docker Go SDK, which reads DOCKER_HOST but
# ignores `docker context`. Providers that do not symlink /var/run/docker.sock
# (OrbStack, Colima, Podman) therefore fail the load with "no such file or
# directory" even though the docker CLI itself works, so resolve the active
# context's endpoint and hand it over explicitly. An already-set DOCKER_HOST
# wins, matching how the CLI resolves the same precedence.
#
# The Go format string is wrapped in a raw block because mise renders task
# scripts through Tera, which would otherwise parse the {{ }} as its own
# template syntax and fail the config.
[tasks.image]
description = "Build a container image with ko (see docs/deploy.md)"
env.KO_DOCKER_REPO = "ko.local/bang"
run = """
export DOCKER_HOST="${DOCKER_HOST:-$(docker context inspect --format '{% raw %}{{ .Endpoints.docker.Host }}{% endraw %}')}"
ko build --local --bare --platform=linux/$(go env GOARCH) .
"""

# Serves 9111 so the always-on container does not fight `mise run dev`, which
# serves the tracked config on 8111. Both can run at once; point the browser at
# whichever instance you mean.
#
# --restart unless-stopped is what replaces a launchd job: the daemon brings the
# container back at startup, so bang is up whenever OrbStack is. An explicit
# `docker stop bang` stays stopped until the next `mise run prod`.
#
# The deploy directory is mounted rather than the config file itself. Editors
# commonly save by replacing the file, and a single-file bind mount pins the
# original inode, so the container would never see an edit.
#
# A literal TOML string keeps the shell line continuations intact — in a basic
# """ string TOML would eat the backslash and fold the command onto one line.
[tasks.prod]
description = "Build the image and run it as the always-on `bang` container"
depends = ["image"]
run = '''
config="$MISE_PROJECT_ROOT/deploy/config.local.toml"
# Seeded with listen rewritten because a published port only reaches the server
# when it listens on all container interfaces, not container loopback.
[ -f "$config" ] || sed "s|^listen =.*|listen = '0.0.0.0:9111'|" \
  "$MISE_PROJECT_ROOT/deploy/config.toml" > "$config"

# Replace any previous container so the task is re-runnable after a rebuild.
docker rm -f bang >/dev/null 2>&1 || true
docker run -d --name bang \
  --restart unless-stopped \
  -p 127.0.0.1:9111:9111 \
  -v "$MISE_PROJECT_ROOT/deploy:/config:ro" \
  ko.local/bang:latest -config /config/config.local.toml
'''

[tasks.clean]
description = "Remove build output"
run = "rm -rf bin"

# -- test --

[tasks.test]
description = "Run the Go test suite"
alias = "t"
run = "go test -race -cover -count=1 -shuffle=on -timeout=5m ./..."

[tasks.bench]
description = "Benchmark shortcut resolution"
run = "go test ./internal/config -run '^$' -bench '^BenchmarkResolve' -benchmem"

# -- lint / fmt --

[tasks.lint]
description = "Lint Go and shell sources"
alias = "l"
run = ["golangci-lint run ./...", "shellcheck scripts/*.sh"]

[tasks.fmt]
description = "Format Go, shell, and prose sources"
run = [
  "golangci-lint fmt ./...",
  "golangci-lint run --fix ./...",
  "shfmt -w -i 2 -ci scripts/*.sh",
  "prettier --write '**/*.md' '**/*.json'",
]
